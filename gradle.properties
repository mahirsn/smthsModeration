org.gradle.jvmargs=-Xmx2G -XX:+UseG1GC
org.gradle.parallel=true

# Minecraft 26.1+ ships unobfuscated with official Mojang names; Fabric no
# longer publishes Yarn/Intermediary, so there is no yarn_mappings property.
minecraft_version=26.3
loader_version=0.19.5
# fabric-loom's version is pinned directly in build.gradle's plugins {} block
# (Gradle requires a literal there, not a property).

mod_version=1.0.0
maven_group=com.smthsmoderation
archives_base_name=smthsmoderation

fabric_version=0.160.6+26.3
cloth_version=26.3.158
modmenu_version=21.0.0-beta.1

# Loom 1.18+ Java 25 hedefliyor; sistem varsayilani Java 26 oldugu icin
# Gradle varyant eslesmesini reddediyor. Sadece bu proje icin 25 kullan.
org.gradle.java.home=/usr/share/idea/jbr
